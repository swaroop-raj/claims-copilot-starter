version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: claims-copilot-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: claims_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d claims_copilot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
