[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-copilot-starter"
version = "0.1.0"
description = "Starter scaffold for a claims-grounded RAG chatbot built with Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "streamlit>=1.48.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy>=2.0.43",
  "psycopg[binary]>=3.2.9",
  "alembic>=1.16.0",
  "pgvector>=0.3.6",
  "langchain>=0.3.27",
  "langchain-openai>=0.3.32",
  "portkey-ai>=1.16.0",
  "presidio-analyzer>=2.2.358",
  "presidio-anonymizer>=2.2.358",
  "structlog>=25.4.0",
  "httpx>=0.28.1",
  "python-dotenv>=1.1.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.1",
  "deepeval>=3.5.6",
  "mypy>=1.17.1",
  "ruff>=0.12.10",
  "types-requests>=2.32.4.20250809"
]

[tool.setuptools]
packages = ["api", "app", "core", "pipelines"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
plugins = ["pydantic.mypy"]
